// 定义proto使用的版本
syntax = "proto2";
//定义包名，在cc文件中调用
package cyber_y.proto;
//定义消息体
message IndicatorLog {
    optional string node_name = 1;
    optional uint64 node_id = 2;
    optional string channel_name = 3;
    optional uint64 channel_id = 4;
    
    optional uint64 interval = 5;//ms
    optional double cpu_usage = 6;
    optional double shm_usage = 7;

    optional uint64 write_time = 8;
    optional uint64 enqueue_time = 9;
    optional uint64 dequeue_time = 10;
    optional uint64 read_time = 11;
}
