// 定义proto使用的版本
syntax = "proto2";
//定义包名，在cc文件中调用
package cyber_y.proto;
//定义消息体
message JuniorLog {
    optional string node_name = 1;
    optional uint64 node_id = 2;
    optional string channel_name = 3;
    optional uint64 channel_id = 4;
    optional uint64 write_time = 5;
    optional uint64 read_time = 6;
}
